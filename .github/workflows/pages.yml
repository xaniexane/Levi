# LEVI web console -> GitHub Pages (free tier, public repo).
#
# Honest labeling: this is an *optional deployment target* on GitHub's
# platform — the pragmatic free path, not the pure self-reliant one.
# `levi serve` on your own box is the pure path (docs/HOSTING.md).
# LEVI_SELFHOST=1 keeps the platform branding injector out of the build,
# so no "Created with Grok / Remix" pill ships on LEVI-controlled builds.

name: Deploy web to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (LEVI self-hosted, no platform branding)
        # NOTE: --base must reach `vite build` directly — `npm run build -- --base=…`
        # would append it to `db:migrate` instead, so the wrapper is invoked explicitly
        # with the local vite binary (npm's .bin PATH shim is absent outside npm run).
        run: |
          LEVI_SELFHOST=1 node scripts/with-app-env.mjs ./node_modules/.bin/vite build --base=/Levi/
          npm run db:migrate
        env:
          CI: "true"

      - name: Static shell + SPA fallback for GitHub Pages
        # The SSR build emits no index.html; static-shim.mjs generates one from
        # the build's own manifest, then 404.html gives Pages its SPA fallback.
        run: |
          node scripts/static-shim.mjs
          cp .vercel/output/static/index.html .vercel/output/static/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vercel/output/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
