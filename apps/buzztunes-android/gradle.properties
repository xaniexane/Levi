# Gradle / Android build settings for BuzzTunes.
# -Djava.net.preferIPv4Stack=true: the sandbox egress proxy blocks IPv6 TCP
# (dependency downloads fail); harmless on normal networks.
# Lean heap: this sandbox is memory-constrained and runs parallel builders.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=false

# AndroidX / Jetpack
android.useAndroidX=true
android.nonTransitiveRClass=true
