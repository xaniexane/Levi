# Gradle / Android build settings for the LEVI Android shell app.
# -Djava.net.preferIPv4Stack=true: the sandbox egress proxy blocks IPv6 TCP
# (dependency downloads fail); harmless on normal networks.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
