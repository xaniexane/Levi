# Gradle / Android build settings for VYVE Messenger.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX / Jetpack
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# KSP 2 (runs in the Gradle daemon; required for current KSP releases)
ksp.useKSP2=true

# Compose 1.12.0 / androidx.core 1.19.0 declare compileSdk 37 in their AAR
# metadata, but Google has not published a platforms;android-37 SDK package
# (sdkmanager: "Failed to find package 'platforms;android-37'"), so we
# compile against 36 and suppress the metadata check. Revisit once the
# Android 37 platform ships: bump compileSdk/targetSdk to 37 and drop this.
android.suppressUnsupportedCompileSdk=37

# ---- Release signing (Play App Signing) ----
# The upload keystore is NEVER committed (see .gitignore: *.keystore, *.jks).
# Provide it ONE of these ways; app/build.gradle.kts prefers env vars (CI)
# and falls back to these properties (local dev):
#   vyve.keystore.path=/absolute/path/to/vyve-upload.keystore
#   vyve.keystore.password=...
#   vyve.key.alias=vyve-upload
#   vyve.key.password=...
# How to create the key: see RUNBOOK.md ("Release signing").
# vyve.keystore.path=
# vyve.key.alias=vyve-upload
