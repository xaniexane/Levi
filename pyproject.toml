[project]
name = "levi"
description = "LEVI — local-first synthetic intelligence (proprietary)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Chauncey J. Logan / Cybrus AI Systems" }]
dynamic = ["version"]
dependencies = []

[project.scripts]
levi = "levi.agent.cli:main"

[tool.setuptools.packages.find]
where = ["core"]
include = ["levi*"]

[tool.setuptools.dynamic]
version = { attr = "levi.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
[tool.ruff.lint.isort]
known-first-party = ["levi"]
