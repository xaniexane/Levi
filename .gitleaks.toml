# LEVI gitleaks config — auto-discovered by gitleaks-action (repo root).
#
# IMPORTANT: gitleaks applies only ONE allowlist per rule id — keep exactly one
# [[rules]] block per id below, with all paths merged into it.
#
# Every allowlist entry is a documented FALSE POSITIVE: ordinary prose or
# literal placeholders, never a real credential — EXCEPT the catalog.json entry
# at the bottom, which is a documented, redacted third-party token (see note).
# Real secrets must never be committed; see web/src/lib/auth/preview.ts
# (env-injected, fail-closed).

title = "LEVI secret scan"

[extend]
useDefault = true

# --- generic-api-key ---
# * Defensive cyber playbooks: prose trips the entropy rule ("token and OTP
#   validation", "FIDO2-certified keys", "Argon2id/bcrypt/scrypt") — no
#   credentials in these files.
# * Academy lesson index: "key" holds lesson SLUGS
#   ("health-fitness-morning-stretch-ritual-01"), not credentials.
# * tests/test_growth_ops_harvest.py, tests/test_lifepack_bundle.py,
#   tests/test_observability.py: SYNTHETIC fixtures (sk-test-...,
#   _SYNTH_SECRET, mxoxb-1234-...) used to exercise secret-scrubbing.
# * core/levi/knowledge/courses/catalog.json is NOT a false positive: harvested
#   PUBLIC course-catalog data (awesome-courses ingestion) that once contained a
#   third-party mailing-list subscribe token (nb.mit.edu/subscribe?key=...).
#   The working-tree value is REDACTED (subscribe?key=<redacted>); the path
#   stays allowlisted so pre-redaction git history does not trip the scanner.
#   No LEVI credential and no Chauncey credential is, or ever was, in this file.
[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "documented false positives: cyber-playbook prose, lesson slug keys, synthetic test fixtures; plus redacted third-party token in harvested public catalog data (history coverage)"
paths = [
  "core/levi/skill/playbooks/cyber/exploiting-type-juggling-vulnerabilities.md",
  "core/levi/skill/playbooks/cyber/implementing-hardware-security-key-authentication.md",
  "core/levi/skill/playbooks/cyber/performing-cryptographic-audit-of-application.md",
  "core/levi/academy/lessons/founders/index.json",
  "tests/test_growth_ops_harvest.py",
  "tests/test_lifepack_bundle.py",
  "tests/test_observability.py",
  "core/levi/knowledge/courses/catalog.json",
  # Vendored upstream llama.cpp (untracked locally; allowlisted so a future
  # commit of the vendored tree does not trip the scanner on public code):
  "apps/levi-android/android/inference/src/main/cpp/llama.cpp/vendor/hash/xxhash/xxhash.h",
  "apps/levi-android/android/inference/src/main/cpp/llama.cpp/tools/server/tests/unit/test_completion.py",
]

# --- curl-auth-header: docs use literal placeholders ("<redacted>",
# "levi_sk_...") in curl examples, never a real bearer token.
[[rules]]
id = "curl-auth-header"

[rules.allowlist]
description = "docs use literal placeholders, not real tokens"
paths = [
  "docs/AGENT.md",
  "docs/CLOUD_API.md",
  # Vendored upstream llama.cpp server README (public curl examples):
  "apps/levi-android/android/inference/src/main/cpp/llama.cpp/tools/server/README.md",
]
