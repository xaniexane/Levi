<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LEVI Automation Bridge</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    #flows { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
    .flow { display: flex; gap: 6px; }
    .flow input { flex: 1; }
    #result { font-size: 12px; white-space: pre-wrap; word-break: break-word;
              background: #f4f4f4; padding: 6px; border-radius: 4px; min-height: 2em; }
    .row { display: flex; gap: 6px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>LEVI Automation Bridge</h1>
  <div id="flows"></div>
  <div class="row">
    <input id="newFlow" type="text" placeholder="new flow id">
    <button id="addFlow">Add</button>
  </div>
  <h2 style="font-size:13px;margin:10px 0 4px">Last result</h2>
  <div id="result">—</div>
  <script src="popup.js"></script>
</body>
</html>
