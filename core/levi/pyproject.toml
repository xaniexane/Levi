[project]
name = "levi-lwp"
version = "0.9.5"
description = "LEVI × L.W.P. local-first symbiotic kernel (proprietary, closed source)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "LEVI owner" }]

[project.scripts]
levi = "levi.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["levi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
